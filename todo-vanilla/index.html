<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo 앱</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">📝 오늘 할 일</h1>
        <p class="app__subtitle">VanillaJS로 만든 Todo 앱</p>
      </header>

      <!-- 입력 영역 -->
      <form id="todo-form" class="todo-form">
        <input
          type="text"
          id="todo-input"
          class="todo-form__input"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
          maxlength="100"
        />
        <button type="submit" class="todo-form__button">추가</button>
      </form>

      <!-- 필터 영역 -->
      <div class="filters" id="filters">
        <button class="filters__button is-active" data-filter="all">전체</button>
        <button class="filters__button" data-filter="active">진행 중</button>
        <button class="filters__button" data-filter="completed">완료</button>
      </div>

      <!-- 할 일 목록 -->
      <ul id="todo-list" class="todo-list"></ul>

      <!-- 비어 있을 때 안내 -->
      <p id="empty-message" class="empty-message">할 일이 없어요. 새로 추가해보세요! ✨</p>

      <!-- 하단 요약/액션 -->
      <footer class="app__footer">
        <span id="todo-count" class="app__count">0개 진행 중</span>
        <button id="clear-completed" class="app__clear">완료 항목 삭제</button>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>

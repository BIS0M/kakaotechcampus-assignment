<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1 class="app__title">Todo</h1>

      <!-- 주간 뷰: 이전/다음 주차 이동 + 월~일 날짜 가로 나열 -->
      <section class="week-view">
        <div class="week-view__header">
          <button id="prevWeekButton" class="week-view__nav" aria-label="이전 주">‹</button>
          <span id="weekRangeLabel" class="week-view__range"></span>
          <button id="nextWeekButton" class="week-view__nav" aria-label="다음 주">›</button>
        </div>
        <!-- 7개 날짜 칸은 JS에서 동적으로 생성된다 -->
        <div id="weekDays" class="week-days"></div>
      </section>

      <!-- Todo 입력 영역: 입력창 + 추가 버튼 -->
      <form id="todoForm" class="todo-form">
        <input
          type="text"
          id="todoInput"
          class="todo-form__input"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
        />
        <button type="submit" class="todo-form__add-button">추가</button>
      </form>

      <!-- 입력값이 비었을 때 보여줄 안내 메시지 -->
      <p id="inputAlert" class="input-alert"></p>

      <!-- 상태별 필터 탭 (전체 / 진행 중 / 완료) -->
      <div id="filterTabs" class="filter-tabs">
        <button class="filter-tabs__tab is-active" data-filter="all">전체</button>
        <button class="filter-tabs__tab" data-filter="active">진행 중</button>
        <button class="filter-tabs__tab" data-filter="completed">완료</button>
      </div>

      <!-- 생성된 Todo가 표시되는 목록 -->
      <ul id="todoList" class="todo-list"></ul>

      <!-- 표시할 Todo가 없을 때 보여줄 빈 상태 안내 -->
      <p id="emptyState" class="empty-state">표시할 할 일이 없어요.</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
